<g transform="translate(6.000 3.045) scale(0.099217)"><desc>경기도일자리재단, 「기관 심볼마크」. 출처: https://www.gjf.or.kr/main/content/view.do?sn=91 . 공공누리 제1유형(출처표시), https://www.kogl.or.kr/info/licenseType1.do . 공식 벡터를 SVG로 변환하고 여백 정리·최적화. 공식 후원·인증을 뜻하지 않음. 화면 색은 CI 안내 RGB 지정값 적용. 기본 심벌 양변 최소 27 CSS px로 배지 생성하며, 인쇄 시 심벌 7mm 이상을 유지해야 함. 잡아바 서비스 로고가 아닌 재단 기관 심벌임.</desc><defs><clipPath id="a"><path d="M0 .0977h174V214H0Zm0 0" /></clipPath><clipPath id="b"><path d="M109 48h162.2617v37H109Zm0 0" /></clipPath><clipPath id="c"><path d="M109 48h162.2617v232.504H109Zm0 0" /></clipPath></defs><g clip-path="url(#a)"><path fill="#90b03e" d="m109.668 123.9414 42.9843-3.0586v40.961L34.5547 175.1914V31.7656l139.0586 6.6055.0508-25.3125L0 .0938v213.8828l173.664-29.7188V99.7656l-63.996 2.0938z" /></g><g clip-path="url(#b)"><path fill="#ed1c24" d="M109.668 62.0313v21.996l124.3125-3.5585 37.2812-31.4805z" /></g><g clip-path="url(#c)"><path fill="#3777bc" d="M233.9805 80.4688v163.328l-100.457-7.9765v-28.211H109.668v52.9532l161.5937 19.9414V48.9883z" /></g></g>
